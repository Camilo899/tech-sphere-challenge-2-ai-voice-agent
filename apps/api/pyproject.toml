[project]
name = "voice-agent-api"
version = "0.1.0"
description = "AI Voice Agent for postoperative follow-up"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]