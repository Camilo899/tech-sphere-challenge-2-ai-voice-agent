authors = [
    { name = "Cristian Julio" }
]

readme = "README.md"

license = { text = "MIT" }


[project]
name = "voice-agent-api"
version = "0.1.0"
description = "AI Voice Agent for postoperative follow-up"
requires-python = ">=3.12"

dependencies = [
    "chromadb>=1.5.9",
    "fastapi",
    "google-genai>=2.17.0",
    "httpx2>=2.9.1",
    "pydantic",
    "sentence-transformers>=5.7.0",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.ruff.lint]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
